<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your LIFEOS Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="register-logo">
                LIFEOS
            </div>

            <h1>Create your account</h1>

            <p class="register-subtitle">
                Start organizing your life with LIFEOS.
            </p>

            <form method="POST">

                <label for="name">
                    Your name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="/login">Log in</a>
            </p>

        </div>

    </div>

</body>

</html>
